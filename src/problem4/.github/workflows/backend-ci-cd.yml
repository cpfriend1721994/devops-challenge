name: Backend CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
    paths:
      - 'src/problem4/backend/**'
      - 'src/problem4/scripts/**'
      - 'src/problem4/.github/workflows/backend-ci-cd.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'src/problem4/backend/**'
      - 'src/problem4/scripts/**'
      - 'src/problem4/.github/workflows/backend-ci-cd.yml'

permissions:
  id-token: write  # Required for AWS OIDC authentication
  contents: read

env:
  AWS_REGION: us-east-1
  DEPLOY_ROLE_ARN: ${{ secrets.AWS_BACKEND_DEPLOY_ROLE_ARN || 'arn:aws:iam::123456789012:role/github-actions-backend-deploy' }}
  EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID || 'i-0123456789abcdef0' }}
  S3_ARTIFACT_BUCKET: ${{ secrets.S3_ARTIFACT_BUCKET || 'my-company-deploy-artifacts' }}

jobs:
  ci-test:
    name: Lint, Test & Package (Bun Runtime)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src/problem4/backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Syntax & Lint Validation
        run: bun run lint

      - name: Execute Automated Unit Tests
        run: bun test

      - name: Package Deployment Artifact
        run: |
          mkdir -p ../dist
          cp ../scripts/deploy-backend.sh ./deploy-backend.sh
          tar -czf ../dist/backend-${{ github.sha }}.tar.gz server.js package.json deploy-backend.sh api.service
          rm ./deploy-backend.sh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-artifact
          path: src/problem4/dist/backend-${{ github.sha }}.tar.gz
          retention-days: 7

  cd-deploy:
    name: Deploy to EC2 Graviton5 (Zero Downtime)
    needs: ci-test
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-artifact
          path: dist

      - name: Authenticate to AWS via OIDC (Keyless)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          role-session-name: GitHubActions-BackendDeploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload Artifact to Secure S3 Transit Bucket
        run: |
          aws s3 cp dist/backend-${{ github.sha }}.tar.gz s3://${{ env.S3_ARTIFACT_BUCKET }}/backend/${{ github.sha }}.tar.gz

      - name: Execute Zero-Downtime Rollout on EC2 via AWS Systems Manager (SSM)
        run: |
          echo "[SSM] Triggering deploy script on EC2 Graviton5 instance ${{ env.EC2_INSTANCE_ID }}..."
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ env.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploying backend version ${{ github.sha }}" \
            --parameters commands='[
              "aws s3 cp s3://'"${{ env.S3_ARTIFACT_BUCKET }}"'/backend/'"${{ github.sha }}"'.tar.gz /tmp/backend-artifact.tar.gz",
              "tar -xzf /tmp/backend-artifact.tar.gz -C /tmp deploy-backend.sh",
              "chmod +x /tmp/deploy-backend.sh",
              "/tmp/deploy-backend.sh /tmp/backend-artifact.tar.gz"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "[SSM] Command dispatched. Command ID: ${COMMAND_ID}"
          echo "[SSM] Awaiting command execution and health check completion..."
          aws ssm wait command-executed --command-id "${COMMAND_ID}" --instance-id "${{ env.EC2_INSTANCE_ID }}"
          STATUS=$(aws ssm get-command-invocation --command-id "${COMMAND_ID}" --instance-id "${{ env.EC2_INSTANCE_ID }}" --query "Status" --output text)
          
          if [ "${STATUS}" != "Success" ]; then
            echo "[ERROR] SSM Command failed with status: ${STATUS}"
            aws ssm get-command-invocation --command-id "${COMMAND_ID}" --instance-id "${{ env.EC2_INSTANCE_ID }}" --query "StandardErrorContent" --output text
            exit 1
          fi
          echo "[SUCCESS] EC2 Backend successfully updated to commit ${{ github.sha }}."
